name: cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-head-branch:
    name: delete the merged head branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch that was just merged
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          # A single DELETE was enough until the API answered 5xx: the branch then stayed behind, which is
          # the one thing this workflow exists to prevent. Retry the calls that change state; a 4xx is a
          # refusal (the branch is gone, or the token may not touch it) and is not retried.
          retry() {
            local label="$1"
            shift
            local attempt=1 output
            while true; do
              if output=$("$@" 2>&1); then
                echo "$output"
                return 0
              fi
              echo "$output" >&2
              if echo "$output" | grep -qiE 'HTTP 4[0-9][0-9]'; then
                echo "$label: the API refused, not retrying" >&2
                return 1
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "$label: giving up after $attempt attempts" >&2
                return 1
              fi
              echo "$label: attempt $attempt failed, retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          if [ "${BRANCH}" = "${DEFAULT_BRANCH}" ]; then
            echo "refusing to delete the default branch (${BRANCH})"
            exit 0
          fi
          if gh api --silent "repos/${REPO}/git/ref/heads/${BRANCH}" 2>/dev/null; then
            retry "delete ${BRANCH}" gh api --method DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"
            echo "deleted ${BRANCH}"
          else
            echo "${BRANCH} is already gone"
          fi

  sweep:
    name: sweep branches already merged into the default branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every merged branch except the default one
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --prune origin
          # for-each-ref prints the short name, so there is no "origin/" prefix to strip and no
          # "HEAD -> origin/main" line to mistake for a branch. The old parsing let that line through and
          # every sweep tried to delete a branch called "HEAD -> origin/main", which the API refuses with
          # HTTP 422 - so the sweep never deleted anything and always reported a failure.
          git for-each-ref --merged="origin/${DEFAULT_BRANCH}" --format='%(refname:lstrip=3)' refs/remotes/origin/ \
            | grep -v -E "^(HEAD|${DEFAULT_BRANCH})$" \
            > merged.txt || true
          echo "merged branches to sweep:"
          cat merged.txt

          retry() {
            local label="$1"
            shift
            local attempt=1 output
            while true; do
              if output=$("$@" 2>&1); then
                return 0
              fi
              echo "$output" >&2
              if echo "$output" | grep -qiE 'HTTP 4[0-9][0-9]'; then
                echo "$label: the API refused, not retrying" >&2
                return 1
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "$label: giving up after $attempt attempts" >&2
                return 1
              fi
              echo "$label: attempt $attempt failed, retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # One stubborn branch used to end the sweep (the failing DELETE returned non-zero under set -e),
          # leaving every branch after it in place. Each branch is retried on its own now, and the ones
          # that could not be deleted are reported at the end.
          failed=0
          deleted=0
          while read -r branch; do
            [ -z "${branch}" ] && continue
            if retry "delete ${branch}" gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"; then
              echo "deleted ${branch}"
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < merged.txt

          echo "deleted ${deleted} branch(es), ${failed} left in place"
          [ "${failed}" -eq 0 ]
