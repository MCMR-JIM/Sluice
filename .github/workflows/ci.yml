name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  cross-publish:
    name: publish check (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # EnableWindowsTargeting lets a Linux runner cross compile the WPF project.
      - name: Publish the command line tool
        run: >
          dotnet publish src/Sluice.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:EnableWindowsTargeting=true
          -o dist/${{ matrix.rid }}

      - name: Publish the desktop window
        run: >
          dotnet publish src/Sluice.Desktop
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:EnableWindowsTargeting=true
          -o dist/${{ matrix.rid }}-ui

      # The runner is Linux, so the Windows binary can be built here but not executed: the check
      # is that it exists, starts with a PE header and carries a plausible amount of data.
      - name: Check both artifacts
        run: |
          for BIN in "dist/${{ matrix.rid }}/Sluice.exe" "dist/${{ matrix.rid }}-ui/Sluice.UI.exe"; do
            test -f "${BIN}"
            SIZE=$(stat -c%s "${BIN}")
            echo "${BIN}: ${SIZE} bytes"
            test "${SIZE}" -gt 1000000
            head -c 2 "${BIN}" | od -An -tx1 | grep -qi '4d 5a'
          done
          echo "both binaries are PE images"
