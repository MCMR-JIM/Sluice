name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  cross-publish:
    name: publish check (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/StoreDownloader.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist/${{ matrix.rid }}

      # A cross published binary cannot run on the runner unless the architecture and the
      # platform match, so only linux-x64 is actually executed; everything else is checked
      # for shape: the file exists and carries a plausible amount of data.
      - name: Check the artifact, execute it when the runner can
        run: |
          if [ -f "dist/${{ matrix.rid }}/storedl.exe" ]; then
            BIN="dist/${{ matrix.rid }}/storedl.exe"
          else
            BIN="dist/${{ matrix.rid }}/storedl"
          fi
          test -f "${BIN}"
          SIZE=$(stat -c%s "${BIN}")
          echo "${BIN}: ${SIZE} bytes"
          test "${SIZE}" -gt 1000000
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then
            chmod +x "${BIN}"
            "${BIN}" --version
            "${BIN}" --help | head -n 5
          fi
