name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.2.0'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
          - rid: win-x86
            asset: windows-x86
          - rid: win-arm64
            asset: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Publish the command line tool
        run: >
          dotnet publish src/Sluice.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o dist

      - name: Publish the desktop window
        run: >
          dotnet publish src/Sluice.Desktop
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o dist-ui

      - name: Pack both binaries for this architecture
        run: |
          mkdir -p release-assets
          ASSET="release-assets/Sluice-${{ steps.version.outputs.version }}-${{ matrix.asset }}.zip"
          cd dist && zip -q "${OLDPWD}/${ASSET}" Sluice.exe
          cd .. && cd dist-ui && zip -q "${OLDPWD}/${ASSET}" Sluice.UI.exe
          cd .. && unzip -l "${ASSET}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: create the release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd release-assets
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the notes preamble
        run: |
          cat > notes.md <<'EOF'
          ## Sluice, a Windows tool

          This tool deploys Store packages with `Add-AppxPackage` through PowerShell, so the builds are
          Windows only. Every archive is self-contained: no .NET runtime has to be installed, and it
          carries both faces of the tool:

          - `Sluice.exe`, the command line tool
          - `Sluice.UI.exe`, the desktop window (acrylic backdrop, opaque panels)

          | Machine | Asset |
          | --- | --- |
          | Windows x64 | `Sluice-<version>-windows-x64.zip` |
          | Windows x86 | `Sluice-<version>-windows-x86.zip` |
          | Windows arm64 | `Sluice-<version>-windows-arm64.zip` |

          Verify the download against `SHA256SUMS.txt` before running it, then:

          ```
          .\Sluice.exe doctor
          .\Sluice.exe install <store-link>
          .\Sluice.UI.exe
          ```

          ### Verified on a virtual machine

          The `install-test` workflow builds the tool from the commit under test and runs a real
          sideload on a disposable hosted Windows runner: it enables sideloading, prints `doctor`,
          resolves the link, plans, installs the framework packages the app is missing, then the
          application bundle, reads the registration back, and removes the package again. Run it
          from Actions, or from a shell:

          ```
          gh workflow run install-test.yml -f store_url='<store-link>'
          gh run watch
          ```

          Nothing in that run touches a developer machine.

          ### History
          EOF
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="Sluice ${{ steps.version.outputs.version }}"

          # Every call below talks to the GitHub API, which answers 5xx on its own schedule: release
          # v0.4.37 failed here on a single HTTP 500 after the three publish jobs had already succeeded,
          # and the release had to be re-run by hand. A 4xx is a refusal, not a hiccup, so it is not
          # retried - the fallback below handles the one refusal that matters (the release already
          # exists).
          retry() {
            local label="$1"
            shift
            local attempt=1 output
            while true; do
              if output=$("$@" 2>&1); then
                echo "$output"
                return 0
              fi
              echo "$output" >&2
              echo "$output" > "${RUNNER_TEMP}/last-attempt.log"
              if echo "$output" | grep -qiE 'HTTP 4[0-9][0-9]'; then
                echo "$label: the API refused, not retrying" >&2
                return 1
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "$label: giving up after $attempt attempts" >&2
                return 1
              fi
              echo "$label: attempt $attempt failed, retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} exists, replacing its assets and notes"
            retry "upload the assets" gh release upload "${TAG}" release-assets/* --clobber
            retry "update the notes" gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
          elif retry "create the release" gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes-file notes.md --generate-notes; then
            echo "created ${TAG}"
          elif grep -qiE "already exists|HTTP 422" "${RUNNER_TEMP}/last-attempt.log"; then
            # The release appeared between the two calls, so this run only has to fill it in.
            echo "the release appeared while this job ran; updating it"
            retry "upload the assets" gh release upload "${TAG}" release-assets/* --clobber
            retry "update the notes" gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
          else
            echo "could not create or update the release" >&2
            exit 1
          fi
