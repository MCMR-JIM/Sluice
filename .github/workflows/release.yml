name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.2.0'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64.exe
          - rid: win-x86
            asset: windows-x86.exe
          - rid: win-arm64
            asset: windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/StoreDownloader.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o dist

      - name: Name the binary for the release
        run: |
          mkdir -p assets
          ASSET="assets/storedl-${{ steps.version.outputs.version }}-${{ matrix.asset }}"
          cp dist/storedl.exe "${ASSET}"
          ls -l "${ASSET}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: assets/*
          if-no-files-found: error

  release:
    name: create the release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the notes preamble
        run: |
          cat > notes.md <<'EOF'
          ## storedl, a Windows tool

          This tool deploys Store packages with `Add-AppxPackage` through PowerShell, so the builds are
          Windows only. Every asset is self-contained: no .NET runtime has to be installed.

          | Machine | Asset |
          | --- | --- |
          | Windows x64 | `storedl-<version>-windows-x64.exe` |
          | Windows x86 | `storedl-<version>-windows-x86.exe` |
          | Windows arm64 | `storedl-<version>-windows-arm64.exe` |

          Verify the download against `SHA256SUMS.txt` before running it, then:

          ```
          .\storedl-<version>-windows-x64.exe doctor
          .\storedl-<version>-windows-x64.exe install https://apps.microsoft.com/detail/9nksqgp7f2nh
          ```

          ### History
          EOF
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="storedl ${{ steps.version.outputs.version }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} exists, replacing its assets and notes"
            gh release upload "${TAG}" assets/* --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
          else
            # No --target here: the tag already exists when a release is rebuilt, and the API
            # rejects a target for a tag that is already there.
            gh release create "${TAG}" \
              assets/* \
              --title "${TITLE}" \
              --notes-file notes.md \
              --generate-notes
          fi
