name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.2.0'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
          - rid: win-x86
            asset: windows-x86
          - rid: win-arm64
            asset: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Publish the command line tool
        run: >
          dotnet publish src/StoreDownloader.Cli
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o dist

      - name: Publish the desktop window
        run: >
          dotnet publish src/StoreDownloader.Desktop
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -o dist-ui

      - name: Pack both binaries for this architecture
        run: |
          mkdir -p assets
          ASSET="assets/StoreDownloader-${{ steps.version.outputs.version }}-${{ matrix.asset }}.zip"
          cd dist && zip -q "${OLDPWD}/${ASSET}" StoreDownloader.exe
          cd .. && cd dist-ui && zip -q "${OLDPWD}/${ASSET}" StoreDownloader.UI.exe
          cd .. && unzip -l "${ASSET}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: assets/*
          if-no-files-found: error

  release:
    name: create the release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the notes preamble
        run: |
          cat > notes.md <<'EOF'
          ## StoreDownloader, a Windows tool

          This tool deploys Store packages with `Add-AppxPackage` through PowerShell, so the builds are
          Windows only. Every archive is self-contained: no .NET runtime has to be installed, and it
          carries both faces of the tool:

          - `StoreDownloader.exe`, the command line tool
          - `StoreDownloader.UI.exe`, the desktop window (Fluent dark, acrylic or Mica backdrop)

          | Machine | Asset |
          | --- | --- |
          | Windows x64 | `StoreDownloader-<version>-windows-x64.zip` |
          | Windows x86 | `StoreDownloader-<version>-windows-x86.zip` |
          | Windows arm64 | `StoreDownloader-<version>-windows-arm64.zip` |

          Verify the download against `SHA256SUMS.txt` before running it, then:

          ```
          .\StoreDownloader.exe doctor
          .\StoreDownloader.exe install <store-link>
          .\StoreDownloader.UI.exe
          ```

          ### Verified on a virtual machine

          The `install-test` workflow builds the tool from the commit under test and runs a real
          sideload on a disposable hosted Windows runner: it enables sideloading, prints `doctor`,
          resolves the link, plans, installs the framework packages the app is missing, then the
          application bundle, reads the registration back, and removes the package again. Run it
          from Actions, or from a shell:

          ```
          gh workflow run install-test.yml -f store_url='<store-link>'
          gh run watch
          ```

          Nothing in that run touches a developer machine.

          ### History
          EOF
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="StoreDownloader ${{ steps.version.outputs.version }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} exists, replacing its assets and notes"
            gh release upload "${TAG}" assets/* --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
          else
            # No --target here: the tag already exists when a release is rebuilt, and the API
            # rejects a target for a tag that is already there.
            gh release create "${TAG}" \
              assets/* \
              --title "${TITLE}" \
              --notes-file notes.md \
              --generate-notes
          fi
